<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheEdge 邊緣咖啡 - 深夜咖啡廳</title>
    <style>
        body {
            background-color: #3b2818;
            color: #e8dcc7;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.8;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #2c1e13;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h1 {
            color: #ffbf00;
            border-bottom: 2px solid #5a3d25;
            padding-bottom: 10px;
        }
        .info-group {
            margin-bottom: 15px;
        }
        .label {
            color: #ffbf00;
            font-weight: bold;
            margin-right: 10px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #ffbf00;
            text-decoration: none;
            border: 1px solid #ffbf00;
            padding: 5px 15px;
            border-radius: 20px;
            transition: 0.3s;
        }
        .back-link:hover {
            background-color: #ffbf00;
            color: #2c1e13;
        }
        .cafe-photo {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 2px solid #5a3d25;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">← 返回總覽</a>

            星期二：14:00 – 22:00<br>
            星期六、星期日：13:00 – 20:00<br>
            (每週三固定公休)

        <div class="info-group">

        <div class="info-group">

        </div>
