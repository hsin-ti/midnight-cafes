<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QIYU Café & Lounge - 深夜咖啡廳</title>
    <style>
        body {
            background-color: #3b2818;
            color: #e8dcc7;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            line-height: 1.8;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #2c1e13;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h1 {
            color: #ffbf00;
            border-bottom: 2px solid #5a3d25;
            padding-bottom: 10px;
        }
        .info-group {
            margin-bottom: 15px;
        }
        .label {
            color: #ffbf00;
            font-weight: bold;
            margin-right: 10px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #ffbf00;
            text-decoration: none;
            border: 1px solid #ffbf00;
            padding: 5px 15px;
            border-radius: 20px;
            transition: 0.3s;
        }
        .back-link:hover {
            background-color: #ffbf00;
            color: #2c1e13;
        }
        .cafe-photo {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 2px solid #5a3d25;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">← 返回總覽</a>
        
        <h1>QIYU Café & Lounge</h1>
        
        <img src="images/qiyu-cafe.jpg" alt="QIYU Café & Lounge 店內環境" class="cafe-photo">

        <div class="info-group">
            <span class="label">🕒 營業時間：</span>09:00 - 21:00
        </div>
        
        <div class="info-group">
            <span class="label">💰 低消限制：</span>一杯飲料
        </div>
        
        <div class="info-group">
            <span class="label">⏳ 時間限制：</span>不限時
        </div>

        <div class="info-group">
            <span class="label">🔌 插座與網路：</span>有插座 / 提供免費網路
        </div>

        <div class="info-group">
            <span class="label">☕ 招牌推薦：</span>(待提供資料)
        </div>

        <div class="info-group">
            <span class="label">📍 地址：</span>台北市松山區南京東路四段133巷4弄24號1樓 (近台北小巨蛋)
        </div>
    </div>
</body>
</html>
